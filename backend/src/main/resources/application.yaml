spring:
  application:
    name: homehub
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3307}/${MARIADB_DATABASE:homehub}
    username: ${MARIADB_USER:homehub}
    password: ${MARIADB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

homehub:
  host-agent:
    base-url: ${HOST_AGENT_BASE_URL:http://localhost:9101}
    token: ${HOST_AGENT_TOKEN:}
    connect-timeout: ${HOST_AGENT_CONNECT_TIMEOUT:2s}
    read-timeout: ${HOST_AGENT_READ_TIMEOUT:3s}
  synology:
    base-url: ${SYNOLOGY_BASE_URL:http://localhost}
    connect-timeout: ${SYNOLOGY_CONNECT_TIMEOUT:2s}
    read-timeout: ${SYNOLOGY_READ_TIMEOUT:5s}
    snmp:
      enabled: ${SYNOLOGY_SNMP_ENABLED:false}
      host: ${SYNOLOGY_SNMP_HOST:localhost}
      port: ${SYNOLOGY_SNMP_PORT:161}
      username: ${SYNOLOGY_SNMP_USERNAME:}
      auth-password: ${SYNOLOGY_SNMP_AUTH_PASSWORD:}
      priv-password: ${SYNOLOGY_SNMP_PRIV_PASSWORD:}
      timeout: ${SYNOLOGY_SNMP_TIMEOUT:3s}
      retries: ${SYNOLOGY_SNMP_RETRIES:1}
      cache-ttl: ${SYNOLOGY_SNMP_CACHE_TTL:5m}
