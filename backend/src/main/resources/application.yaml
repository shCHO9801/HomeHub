spring:
  application:
    name: homehub
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3307}/${MARIADB_DATABASE:homehub}
    username: ${MARIADB_USER:homehub}
    password: ${MARIADB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

homehub:
  synology:
    base-url: ${SYNOLOGY_BASE_URL:http://localhost}
    connect-timeout: ${SYNOLOGY_CONNECT_TIMEOUT:2s}
    read-timeout: ${SYNOLOGY_READ_TIMEOUT:5s}