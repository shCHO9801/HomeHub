spring:
  application:
    name: homehub-agent

server:
  address: ${AGENT_BIND_ADDRESS:127.0.0.1}
  port: ${AGENT_PORT:9101}

homehub:
  agent:
    token: ${AGENT_TOKEN}
  docker:
    status-command: ${DOCKER_STATUS_COMMAND:/usr/local/libexec/homehub-docker-status}
    command-timeout: ${DOCKER_COMMAND_TIMEOUT:3s}