name: my-home-hub

services:
  db:
    image: mariadb:11.8.9
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      SYNOLOGY_BASE_URL: ${SYNOLOGY_BASE_URL}
      SYNOLOGY_CONNECT_TIMEOUT: ${SYNOLOGY_CONNECT_TIMEOUT:-2s}
      SYNOLOGY_READ_TIMEOUT: ${SYNOLOGY_READ_TIMEOUT:-5s}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8100:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  db-data:
